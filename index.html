<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Shop.co</title>

    </head>

    <body>

        <header>

            <a href="#">

                <img src="#" alt="">

            </a>

                <nav>

                    <img src="assets/icons/SHOP.CO.png" alt="">

                    <ul>

                        <li>
                            <a href="#">
                                Shop
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                On Sale
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                New Arrivals
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                Brands
                            </a>
                        </li>

                        <input 
                        type="search"
                        name="q"
                        placeholder="Search for products"
                        aria-label="Search through Site Content"
                        required
                        />

                        <div class="account-wrapper">

                            <button id="accountBtn" type="button">

                                Account

                            </button>

                            <div id="accountDropdown" hidden>

                                <a href="/profile">My Profile</a>

                                <a href="/orders">Orders</a>

                                <a href="/logout">Log Out</a>

                            </div>

                        </div>

                        <div class="cart-wrapper">

                            <button id="cartBtn" type="button">

                                <img src="assets/icons/Vector-3.png" alt=""> <span id="cartCount">0</span>

                            </button>

                            <aside id="cartDrawer" hidden>

                                <button id="closeCartBtn" type="button">Close</button>

                                <p>
                                    Your cart items go here.
                                </p>

                                <a href="/checkout">
                                    Checkout
                                </a>

                            </aside>
                            
                        </div>

                    </ul>

                </nav>

        </header>

        <main>

            

        </main>
        
    </body>

</html>
